workflows:
  lumi-android-debug:
    name: Lumi Android - compilación integral
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      java: 17

    scripts:
      - name: Preparar Android SDK
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

      - name: Preparar y verificar Gradle
        script: |
          set -e
          gradle --version
          gradle wrapper --gradle-version 8.9 --distribution-type bin
          chmod +x ./gradlew
          ./gradlew --version

      - name: Compilación limpia completa + Lint
        script: |
          ./gradlew --no-daemon --stacktrace clean :app:assembleDebug :app:lintDebug

      - name: Verificar APK generado
        script: |
          set -e
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk
      - app/build/outputs/**/*.apk
      - app/build/reports/lint-results-debug.html
